[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes
markers =
    spatial: pruebas que requieren PostgreSQL+PostGIS (omitidas en SQLite)
filterwarnings =
    ignore::DeprecationWarning:passlib.*
    ignore::DeprecationWarning:sqlalchemy.*
    ignore::PendingDeprecationWarning
