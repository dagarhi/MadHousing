<app-drawer-shell
  [(opened)]="opened"
  (openedChange)="onOpenedChange($event)"
  [title]="'DRAWER_ESTADISTICAS.TITLE' | transloco"
  position="right"
  [width]="'900px'"
  [loading]="loading"
>
  <div drawer-content>
    <div class="controls">
      <!-- Tipo de operación -->
      <div class="group">
        <label for="est-tipo-operacion">
          <lucide-icon name="house"></lucide-icon>
          {{ 'DRAWER_ESTADISTICAS.OPERATION_TYPE' | transloco }}
        </label>

        <select id="est-tipo-operacion" [(ngModel)]="tipoOperacion" (change)="actualizarGrafico()">
          <option value="sale">{{ 'COMMON.OPERATION.SALE' | transloco }}</option>
          <option value="rent">{{ 'COMMON.OPERATION.RENT' | transloco }}</option>
        </select>
      </div>

      <!-- Métrica -->
      <div class="group">
        <label for="est-metrica">
          <lucide-icon name="bar-chart-3"></lucide-icon>
          {{ 'DRAWER_ESTADISTICAS.METRIC' | transloco }}
        </label>

        <select id="est-metrica" [(ngModel)]="metrica" (change)="actualizarGrafico()">
          <option value="precio_medio">{{ 'DRAWER_ESTADISTICAS.METRIC_PRICE' | transloco }}</option>
          <option value="tamano_medio">{{ 'DRAWER_ESTADISTICAS.METRIC_SIZE' | transloco }}</option>
          <option value="score_medio">{{ 'DRAWER_ESTADISTICAS.METRIC_SCORE' | transloco }}</option>
        </select>
      </div>
    </div>

    <div class="chart-container" *ngIf="!loading && stats">
      <canvas
        baseChart
        [data]="chartData"
        [options]="chartOptions"
        chartType="bar">
      </canvas>
    </div>
  </div>
</app-drawer-shell>
