<div class="vista-mapa">
  <!-- 🔹 Barra superior -->
  <header class="header">
    <!-- Izquierda: logout + admin -->
    <div class="header-left">
      <button mat-button class="logout-btn" (click)="logout()">
        <lucide-icon name="log-out" [size]="18"></lucide-icon>
        <span>Cerrar sesión</span>
      </button>
      <button *ngIf="isAdmin" mat-button class="admin-btn" (click)="goToAdmin()">
        <lucide-icon name="shield" [size]="18"></lucide-icon>
        <span>Admin</span>
      </button>
    </div>

    <!-- Centro: logo + nombre -->
    <div class="header-center">
      <img src="assets/icons/madhousing_header.svg" alt="MadHousing" class="header-logo">
      <span class="header-brand">
        <span class="brand-mad">Mad</span><span class="brand-housing">Housing</span>
      </span>
    </div>

    <!-- Derecha: resto de acciones -->
    <div class="header-right">
      <button mat-button class="theme-btn" (click)="toggleTheme()"
        [attr.aria-label]="theme.isDark ? 'Modo claro' : 'Modo oscuro'">
        <lucide-icon [name]="theme.isDark ? 'sun' : 'moon'" [size]="18"></lucide-icon>
      </button>
      <button mat-button (click)="cerrarOtros('favoritos')">
        <lucide-icon name="heart" [size]="18"></lucide-icon>
        Favoritos
      </button>

      <button mat-button (click)="cerrarOtros('historial')">
        <lucide-icon name="history" [size]="18"></lucide-icon>
        Historial
      </button>

      <button mat-button (click)="cerrarOtros('estadisticas')">
        <lucide-icon name="bar-chart-3" [size]="18"></lucide-icon>
        Estadísticas
      </button>

      <button mat-button (click)="cerrarOtros('comparador')">
        <lucide-icon name="columns-3" [size]="18"></lucide-icon>
        Comparador
      </button>

      <button mat-button (click)="cerrarOtros('buscador')">
        <lucide-icon name="search" [size]="18"></lucide-icon>
        Buscador
      </button>
    </div>
  </header>
  <app-map-help appSnapDrag snapId="help" defaultZone="TR" [userKey]="userHelpKey"></app-map-help>


  <!-- 🔹 Contenedor principal del mapa -->
  <main class="mapa-container">
    <app-mapa-principal [pisos]="pisos" (clear)="limpiarMapa()"></app-mapa-principal>
  </main>

  <!-- 🔹 Drawers -->
  <app-drawer-favoritos [(opened)]="mostrarFavoritos" (openedChange)="mostrarFavoritos = $event">
  </app-drawer-favoritos>
  <app-drawer-historial [(opened)]="mostrarHistorial" (openedChange)="mostrarHistorial = $event"
    (reaplicar)="onReaplicarHist($event)">
  </app-drawer-historial>
  <app-drawer-estadisticas [(opened)]="mostrarEstadisticas" (openedChange)="mostrarEstadisticas = $event">
  </app-drawer-estadisticas>
  <app-drawer-comparador [(opened)]="mostrarComparador"
    (openedChange)="mostrarComparador = $event"></app-drawer-comparador>
  <app-buscador [(opened)]="mostrarBuscador" (resultados)="onResultados($event)"
    (openedChange)="mostrarBuscador = $event">
  </app-buscador>

  <!-- 🔹 Controles flotantes -->
  <app-leyenda-score appSnapDrag snapId="leyenda" defaultZone="BL"></app-leyenda-score>
</div>
