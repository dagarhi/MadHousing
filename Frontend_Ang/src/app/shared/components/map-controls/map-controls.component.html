<div class="mc-wrapper" [class.open-up]="openUpward" [class.align-right]="alignRight">

  <!-- ── Pill trigger ── -->
  <button class="mc-pill" [class.mc-pill--radius]="radiusActive" (click)="toggle($event)">
    <span>{{ 'MAP_CONTROLS.TRIGGER' | transloco }}</span>
    <svg class="mc-chevron" [class.open]="open"
         width="13" height="13" viewBox="0 0 24 24"
         fill="none" stroke="currentColor"
         stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="6 9 12 15 18 9"></polyline>
    </svg>
  </button>

  <!-- ── Dropdown panel ── -->
  <div class="mc-panel" *ngIf="open" [@slideDown]>

    <!-- ── VISTA ── -->
    <div class="mc-section mc-section--vista">
      <div class="mc-section-header">
        <lucide-icon name="layers" [size]="12" class="mc-section-header__icon"></lucide-icon>
        <span class="mc-section-header__label">{{ 'MAP_CONTROLS.SECTION_VIEW' | transloco }}</span>
      </div>

      <button
        *ngFor="let layer of layers"
        class="mc-layer-btn"
        [class.active]="activeLayer === layer.value"
        (click)="selectLayer(layer.value, $event)">
        <span class="mc-radio" [class.active]="activeLayer === layer.value"></span>
        {{ layer.labelKey | transloco }}
      </button>
    </div>

    <!-- ── CONTEXTO ── -->
    <div class="mc-section mc-section--contexto">
      <div class="mc-section-header">
        <lucide-icon name="compass" [size]="12" class="mc-section-header__icon"></lucide-icon>
        <span class="mc-section-header__label">{{ 'MAP_CONTROLS.SECTION_CONTEXT' | transloco }}</span>
      </div>

      <button
        *ngFor="let poi of pois"
        class="mc-poi-btn"
        [class.active]="poisActive[poi.key]"
        (click)="togglePoi(poi.key, $event)">
        <span class="mc-check" [class.active]="poisActive[poi.key]">
          <svg *ngIf="poisActive[poi.key]"
               width="9" height="9" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="3.5"
               stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </span>
        <lucide-icon [name]="poi.icon" [size]="13" class="mc-poi-btn__icon"></lucide-icon>
        {{ poi.labelKey | transloco }}
      </button>
    </div>

    <!-- ── HERRAMIENTAS ── -->
    <div class="mc-section mc-section--tools">
      <div class="mc-section-header">
        <lucide-icon name="wrench" [size]="12" class="mc-section-header__icon"></lucide-icon>
        <span class="mc-section-header__label">{{ 'MAP_CONTROLS.SECTION_TOOLS' | transloco }}</span>
      </div>

      <div class="mc-tools-row">
        <button class="mc-tool-btn" [class.active]="radiusActive" (click)="toggleRadius($event)"
          [title]="'MAP_CONTROLS.TOOL_RADIUS_TITLE' | transloco">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="22" y1="12" x2="18" y2="12"/>
            <line x1="6"  y1="12" x2="2"  y2="12"/>
            <line x1="12" y1="6"  x2="12" y2="2"/>
            <line x1="12" y1="22" x2="12" y2="18"/>
          </svg>
          <span>{{ 'MAP_CONTROLS.TOOL_RADIUS' | transloco }}</span>
        </button>

        <button class="mc-tool-btn" [class.active]="isochroneOpen" (click)="toggleIsochrone($event)"
          [title]="'MAP_CONTROLS.TOOL_ISOCHRONE' | transloco">
          <lucide-icon name="clock" [size]="13"></lucide-icon>
          <span>{{ 'MAP_CONTROLS.TOOL_ISOCHRONE' | transloco }}</span>
        </button>

        <button class="mc-tool-btn" [class.active]="routeActive" (click)="toggleRoute($event)"
          [title]="'MAP_CONTROLS.TOOL_ROUTE' | transloco">
          <lucide-icon name="route" [size]="13"></lucide-icon>
          <span>{{ 'MAP_CONTROLS.TOOL_ROUTE' | transloco }}</span>
        </button>
      </div>
    </div>

    <!-- ── ACCIONES ── -->
    <div class="mc-section mc-section--actions">
      <div class="mc-section-header">
        <lucide-icon name="sparkles" [size]="12" class="mc-section-header__icon"></lucide-icon>
        <span class="mc-section-header__label">{{ 'MAP_CONTROLS.SECTION_ACTIONS' | transloco }}</span>
      </div>

      <div class="mc-actions-row">
        <button class="mc-action-btn" (click)="clear($event)">
          <lucide-icon name="brush-cleaning" [size]="13"></lucide-icon>
          {{ 'MAP_CONTROLS.ACTION_CLEAR' | transloco }}
        </button>

        <button class="mc-action-btn" (click)="center($event)">
          <lucide-icon name="navigation-2" [size]="13"></lucide-icon>
          {{ 'MAP_CONTROLS.ACTION_CENTER' | transloco }}
        </button>
      </div>
    </div>
  </div>

</div>
