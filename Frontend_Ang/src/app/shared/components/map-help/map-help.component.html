<!-- ── Botón de ayuda (visible tras ver el tutorial por primera vez) ── -->
<button
  *ngIf="showInfoButton"
  class="help-fab"
  matTooltip="Cómo usar MadHousing"
  matTooltipPosition="left"
  (click)="openDialog()"
>
  <lucide-icon name="info" [size]="15"></lucide-icon>
  <span>Ayuda</span>
</button>

<!-- ── Dialog: carousel tutorial ── -->
<ng-template #helpDialog>
  <div class="tutorial">

    <!-- Cabecera fija -->
    <div class="tutorial__header">
      <span class="tutorial__counter">{{ slideIndex + 1 }} / {{ slides.length }}</span>
      <button class="tutorial__close" mat-dialog-close aria-label="Cerrar">
        <lucide-icon name="x" [size]="16"></lucide-icon>
      </button>
    </div>

    <!-- Contenido de la slide con fade -->
    <div class="tutorial__body" [class.fading]="fading">
      <div class="tutorial__icon-wrap">
        <lucide-icon [name]="current.icon" [size]="36"></lucide-icon>
      </div>
      <h2 class="tutorial__title">{{ current.title }}</h2>
      <p class="tutorial__desc">{{ current.desc }}</p>
    </div>

    <!-- Navegación -->
    <div class="tutorial__nav">
      <button class="nav-btn" (click)="prev()" [disabled]="isFirst" aria-label="Anterior">
        <lucide-icon name="chevron-left" [size]="20"></lucide-icon>
      </button>

      <div class="tutorial__dots">
        <button
          *ngFor="let s of slides; let i = index"
          class="dot"
          [class.dot--active]="i === slideIndex"
          (click)="goTo(i)"
          [attr.aria-label]="'Slide ' + (i + 1)"
        ></button>
      </div>

      <button class="nav-btn" (click)="next()" [disabled]="isLast" aria-label="Siguiente">
        <lucide-icon name="chevron-right" [size]="20"></lucide-icon>
      </button>
    </div>

    <!-- Acción final -->
    <div class="tutorial__footer">
      <button
        *ngIf="isLast"
        class="btn-start"
        mat-dialog-close
      >
        ¡Empezar!
      </button>
      <button
        *ngIf="!isLast"
        class="btn-skip"
        mat-dialog-close
      >
        Saltar tutorial
      </button>
    </div>

  </div>
</ng-template>
