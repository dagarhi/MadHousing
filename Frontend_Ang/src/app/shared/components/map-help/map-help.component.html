<!-- ── Botón de ayuda (visible tras ver el tutorial por primera vez) ── -->
<button
  *ngIf="showInfoButton"
  class="help-fab"
  [matTooltip]="'TUTORIAL.TOOLTIP' | transloco"
  matTooltipPosition="left"
  (click)="openDialog()"
>
  <lucide-icon name="info" [size]="15"></lucide-icon>
  <span>{{ 'TUTORIAL.FAB_LABEL' | transloco }}</span>
</button>

<!-- ── Dialog: carousel tutorial ── -->
<ng-template #helpDialog>
  <div class="tutorial">

    <!-- Cabecera fija -->
    <div class="tutorial__header">
      <span class="tutorial__counter">
        {{ 'TUTORIAL.COUNTER' | transloco:{ current: slideIndex + 1, total: slides.length } }}
      </span>
      <button class="tutorial__close" mat-dialog-close [attr.aria-label]="'COMMON.CLOSE' | transloco">
        <lucide-icon name="x" [size]="16"></lucide-icon>
      </button>
    </div>

    <!-- Contenido de la slide -->
    <div class="tutorial__body">
      <div class="tutorial__icon-wrap">
        <lucide-icon [name]="current.icon" [size]="36"></lucide-icon>
      </div>
      <h2 class="tutorial__title">{{ current.titleKey | transloco }}</h2>
      <p class="tutorial__desc">{{ current.bodyKey | transloco }}</p>
    </div>

    <!-- Navegación -->
    <div class="tutorial__nav">
      <button class="nav-btn" (click)="prev()" [disabled]="isFirst"
        [attr.aria-label]="'TUTORIAL.ARIA_PREV' | transloco">
        <lucide-icon name="chevron-left" [size]="20"></lucide-icon>
      </button>

      <div class="tutorial__dots">
        <button
          *ngFor="let s of slides; let i = index"
          class="dot"
          [class.dot--active]="i === slideIndex"
          (click)="goTo(i)"
          [attr.aria-label]="'TUTORIAL.ARIA_SLIDE' | transloco:{ n: i + 1 }"
        ></button>
      </div>

      <button class="nav-btn" (click)="next()" [disabled]="isLast"
        [attr.aria-label]="'TUTORIAL.ARIA_NEXT' | transloco">
        <lucide-icon name="chevron-right" [size]="20"></lucide-icon>
      </button>
    </div>

    <!-- Acción final -->
    <div class="tutorial__footer">
      <button
        *ngIf="isLast"
        class="btn-start"
        mat-dialog-close
      >
        {{ 'TUTORIAL.START' | transloco }}
      </button>
      <button
        *ngIf="!isLast"
        class="btn-skip"
        mat-dialog-close
      >
        {{ 'TUTORIAL.SKIP' | transloco }}
      </button>
    </div>

  </div>
</ng-template>
