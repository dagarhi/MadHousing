<div class="leyenda" [class.open-up]="openUpward" [class.align-right]="alignRight">

  <button class="toggle" (click)="toggle()"
    [attr.aria-label]="expanded ? 'Cerrar leyenda' : 'Mostrar leyenda de score'">
    <lucide-icon [name]="expanded ? 'x' : 'list-ordered'" [size]="15" aria-hidden="true"></lucide-icon>
    <span *ngIf="!expanded">Leyenda</span>
  </button>

  <div class="panel" *ngIf="expanded">
    <p class="panel__title">Score del piso</p>

    <div class="panel__gradient" [ngStyle]="gradientStyle"></div>

    <div class="panel__labels">
      <span>0</span>
      <span>25</span>
      <span>50</span>
      <span>75</span>
      <span>100</span>
    </div>

    <div class="panel__divider"></div>

    <div class="panel__rows">
      <div class="panel__row">
        <span class="panel__badge panel__badge--sale">Venta</span>
        <span class="panel__info">Relación €/m² — menor es mejor</span>
      </div>
      <div class="panel__row">
        <span class="panel__badge panel__badge--rent">Alquiler</span>
        <span class="panel__info">Precio total — más barato, mejor score</span>
      </div>
    </div>
  </div>

</div>
